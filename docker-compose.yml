services:
  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/folio
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
